name: Radar de Ofertas Tech

on:
  schedule:
    - cron: "0 11 * * *"   # todo dia às 08:00 (horário de Brasília = UTC-3)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora
    inputs:
      teste:
        description: "Modo teste (produtos de exemplo, só para conferir a página e o e-mail)"
        type: boolean
        default: false

permissions:
  contents: write           # para salvar o histórico (data/) e os relatórios no repositório
  pages: write              # para publicar a página de ofertas (GitHub Pages)
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rodar radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          SHOPEE_APP_ID:      ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET:      ${{ secrets.SHOPEE_SECRET }}
          ML_CLIENT_ID:       ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET:   ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN:   ${{ secrets.ML_REFRESH_TOKEN }}
          AMAZON_ACCESS_KEY:  ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY:  ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_PARTNER_TAG: ${{ secrets.AMAZON_PARTNER_TAG }}
        run: python -m radar.main ${{ inputs.teste && '--demo' || '' }}
      - name: Salvar histórico e relatórios
        if: ${{ !inputs.teste }}
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/ reports/
          git diff --cached --quiet || git commit -m "Radar $(date +%F)"
          git push
      - name: Preparar página de ofertas
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports
      - name: Publicar página de ofertas
        id: deployment
        uses: actions/deploy-pages@v4
