filtros:
  comissao_minima: 0.05       # 5%: abaixo disso o produto é descartado
  preco_min_brl: 5            # evita "R$ 0,99" de peças avulsas/iscas
  preco_max_brl: 3000
  vendas_minimas: 5           # quando a plataforma informa vendas
  avaliacao_minima: 4.0       # nota mínima (0-5). Produto sem nenhuma avaliação também é descartado
  # O título precisa conter pelo menos 1 destes termos OU uma palavra da própria busca
  # (garante que é tecnologia)
  exigir_termos: [esp32, esp8266, arduino, raspberry, sensor, modulo, módulo, placa, kit, robo, robô,
                  wifi, wi-fi, zigbee, bluetooth, inteligente, smart, tuya, sonoff, alexa, rele, relé,
                  display, oled, lcd, lora, rfid, servo, motor, protoboard, jumper, fonte, solda,
                  multimetro, multímetro, camera, câmera, fechadura, tomada, interruptor, lampada,
                  lâmpada, hub, controle, nodemcu, microcontrolador, automação, automacao, eletronica,
                  eletrônica, resistor, capacitor, transistor, led, regulador, conversor, driver,
                  osciloscopio, osciloscópio, impressora 3d, filamento, stm32, attiny, wemos]
  # Descarta títulos com estes termos (acessórios fora do nicho, golpes comuns)
  excluir_termos: [capinha, capa para, pelicula, película, adesivo, camiseta, chaveiro, réplica,
                   replica, usado, recondicionado, quebrado, defeito, "para retirada de peças",
                   "envio internacional", "enviado do exterior", "taxa de importação", "taxa de importacao",
                   "para celular", iphone, "galaxy", "brinquedo de pelucia"]

relatorio:
  top_por_categoria: 60       # quantos produtos mostrar por categoria na página
  top_comissoes: 30           # seção "Maiores comissões"
  max_novidades: 40
  queda_minima: 0.10          # avisa quedas de preço >= 10%
  resultados_por_busca: 50
