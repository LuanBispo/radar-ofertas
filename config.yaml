# ============================================================
#  Radar de Ofertas Tech — configuração
#  Edite à vontade: categorias, buscas, filtros e fontes.
# ============================================================

fontes:
  shopee: true        # Shopee Affiliate Open API (retorna comissão real) — liga sozinha quando houver chave
  painel_shopee: true # ofertas reais coletadas no painel de afiliados (data/shopee_painel.json)
  mercadolivre: true  # API do ML (comissão estimada pela tabela abaixo)
  amazon: false       # Amazon (só libera após 3 vendas em 180 dias)
  demo: false         # dados fictícios só para testar o fluxo

# Cada termo é pesquisado de vários jeitos para trazer o máximo de produtos.
# Shopee: 4 = mais barato, 2 = mais vendido, 5 = maior comissão
shopee_ordenacoes: [4, 2, 5]

# Comissão usada quando a plataforma NÃO informa a taxa por produto.
# São estimativas: confira a tabela oficial do seu painel de afiliado e ajuste.
comissao_estimada:
  mercadolivre: 0.05
  amazon: 0.04

